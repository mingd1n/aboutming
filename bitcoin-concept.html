<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Concept | Ming</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #121230; --bg-card: rgba(255,255,255,0.06); --text: #f1f5f9;
            --text-secondary: #a5b4fc; --accent: #8b5cf6; --accent-hover: #c4b5fd;
            --border: rgba(255,255,255,0.12); --shadow: rgba(0,0,0,0.25);
            --toggle-bg: rgba(255,255,255,0.08);
        }
        [data-theme="light"] {
            --bg: #f8f9fc; --bg-card: rgba(255,255,255,0.7); --text: #1e293b;
            --text-secondary: #64748b; --accent: #6366f1; --accent-hover: #4f46e5;
            --border: rgba(0,0,0,0.08); --shadow: rgba(0,0,0,0.06);
            --toggle-bg: rgba(0,0,0,0.04);
        }
        body {
            font-family: 'Inter','Noto Sans SC',sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(139,92,246,0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 90% 80%, rgba(236,72,153,0.10) 0%, transparent 50%);
            color: var(--text); min-height: 100vh; line-height: 1.8;
            transition: background 0.5s ease, color 0.5s ease;
        }
        .theme-switch {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            display: flex; align-items: center; gap: 4px;
            background: var(--toggle-bg); border: 1px solid var(--border);
            border-radius: 24px; padding: 5px; backdrop-filter: blur(10px);
            cursor: pointer; transition: all 0.4s ease; user-select: none;
        }
        .theme-switch:hover { border-color: color-mix(in srgb, var(--accent) 40%, transparent); transform: scale(1.05); }
        .theme-option { padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); transition: all 0.4s ease; }
        .theme-option.active { background: var(--accent); color: white; }
        .container { max-width: 800px; margin: 0 auto; padding: 80px 24px; }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;
            margin-bottom: 30px; transition: color 0.3s ease;
        }
        .back-link:hover { color: var(--accent-hover); }
        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; }
        .subtitle { color: var(--text-secondary); font-size: 1rem; margin-bottom: 40px; }
        .content-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 20px; padding: 32px; box-shadow: 0 4px 24px var(--shadow);
            transition: all 0.4s ease;
        }
        .content-card:hover { border-color: color-mix(in srgb, var(--accent) 20%, transparent); }
        .content-card p { color: var(--text-secondary); margin-bottom: 16px; }
        .content-card h2 { font-size: 1.2rem; color: var(--text); margin: 24px 0 12px; }
        .content-card ul { margin: 8px 0 8px 20px; color: var(--text-secondary); }
        .content-card li { margin-bottom: 6px; }
        .placeholder {
            background: color-mix(in srgb, var(--accent) 5%, transparent);
            border: 2px dashed color-mix(in srgb, var(--accent) 20%, transparent);
            border-radius: 12px; padding: 48px; text-align: center; color: var(--text-secondary);
        }
        @media (max-width: 600px) {
            .container { padding: 60px 20px; }
            h1 { font-size: 1.6rem; }
            .theme-switch { top: 12px; right: 12px; }
        }
    </style>
</head>
<body>
    <div class="theme-switch" onclick="toggleTheme()">
        <span class="theme-option active" data-theme="dark">🌙</span>
        <span class="theme-option" data-theme="light">☀️</span>
    </div>
    <div class="container">
        <a href="index.html" class="back-link">← 返回简历</a>
        <h1>Bitcoin Concept</h1>
        <p class="subtitle">比特币概念学习笔记</p>
        <div class="content-card">
            <div class="placeholder">
                <p>📝 笔记内容待补充</p>
                <p style="font-size: 0.85rem; margin-top: 8px;">你可以直接编辑此文件添加内容</p>
            </div>
        </div>
    </div>
    <script>
        let currentTheme = localStorage.getItem('siteTheme') || 'dark';
        function applyTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('siteTheme', theme);
            document.documentElement.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.theme === theme);
            });
        }
        function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }
        applyTheme(currentTheme);
    </script>
</body>
</html>
